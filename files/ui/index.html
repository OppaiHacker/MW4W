<!doctype html>
<html lang="en">

    <link rel="stylesheet" href="app.css" />

  </head>
  <body>

        <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5" /><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5" /><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5" /></symbol>

        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>

        <symbol id="i-fplus" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" /><path d="M12 10v6M9 13h6" /></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z" /><path d="M14 3v5h5" /></symbol>
        <symbol id="i-fileplus" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z" /><path d="M14 3v5h5M12 11v6M9 14h6" /></symbol>
        <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z" /><path d="M14 3v5h5M9 13h6M9 17h6" /></symbol>

        <symbol id="i-pen" viewBox="0 0 24 24"><path d="M16.5 3.5a2.5 2.5 0 0 1 3.5 3.5L7.5 19.5 3 21l1.5-4.5z" /></symbol>

        <symbol id="i-apps" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.5" /><rect x="3.5" y="13.5" width="7" height="7" rx="1.5" /><path d="M17 13.5v7M13.5 17h7" /></symbol>
        <symbol id="i-term" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2" /><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5" /></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7" /><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7" /></symbol>

        <symbol id="i-conv" viewBox="0 0 24 24"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5" /></symbol>

        <symbol id="i-unzip" viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5 12 14l4.5-4.5" /><path d="M4 15v3.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V15" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" /></symbol>
        <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M5 20h14" /></symbol>
        <symbol id="i-img" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2.5" /><circle cx="9" cy="9" r="2" /><path d="m21 15-5-5L5 21" /></symbol>
        <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></symbol>
        <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="14" height="13" rx="2" /><path d="m21.5 8-5 4 5 4z" /></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none" /></symbol>

        <symbol id="i-lines" viewBox="0 0 24 24"><path d="M6 7h12M6 11h12M6 15h12M6 19h7" /></symbol>

      </defs>
    </svg>

    <div id="app">
      <aside id="side">
        <div class="hdr side-hdr drag">
          <button class="ib" id="b-search" title="Search (Ctrl+F)"><svg class="i"><use href="#i-search" /></svg></button>
          <span class="title">Files</span>
          <button class="ib" id="b-appmenu" title="Main menu"><svg class="i"><use href="#i-more" /></svg></button>
        </div>
        <nav id="places"></nav>
        <div id="ixstat" title="Click to rescan"><span class="dot"></span><span class="t">Index</span></div>
      </aside>

      <main id="main">
        <div class="hdr main-hdr drag">
          <button class="ib" id="b-back" title="Back (Alt+Left)"><svg class="i"><use href="#i-left" /></svg></button>
          <button class="ib" id="b-fwd" title="Forward (Alt+Right)"><svg class="i"><use href="#i-right" /></svg></button>
          <div id="pathbar">
            <div id="crumbs"></div>
            <button class="ib sm" id="b-fmenu" title="Folder menu"><svg class="i"><use href="#i-more" /></svg></button>
          </div>
          <button class="ib" id="b-search2" title="Search this folder (Ctrl+F)"><svg class="i"><use href="#i-fsearch" /></svg></button>
          <button class="ib" id="b-view" title="Grid / list (Ctrl+1, Ctrl+2)"><svg class="i"><use href="#i-grid" /></svg></button>
          <button class="ib" id="b-vmenu" title="View options"><svg class="i" style="width: 13px"><use href="#i-down" /></svg></button>
          <button class="ib" id="b-close" title="Close (Ctrl+W)"><svg class="i"><use href="#i-x" /></svg></button>
        </div>
        <div id="sbar">
          <button class="chip" data-w="here">This folder</button>
          <button class="chip" data-w="all">Everywhere</button>
          <span style="width: 8px"></span>
          <button class="chip" data-c="0">Names</button>
          <button class="chip" data-c="1">Contents</button>
          <span class="stat"></span>
        </div>
        <div id="tbar">
          <span class="grow"></span>
          <button class="btn" id="b-restore"><svg class="i"><use href="#i-undo" /></svg>Restore</button>
          <button class="btn" id="b-purge"><svg class="i"><use href="#i-trash" /></svg>Delete</button>
          <button class="btn danger" id="b-empty">Empty Trash…</button>
        </div>
        <div id="cols">
          <button data-k="name">Name</button>
          <button data-k="size" class="r c-sz">Size</button>
          <button data-k="mtime" class="r c-dt">Modified</button>
          <span></span>
        </div>
        <div id="scroller" tabindex="0">
          <div id="sizer"></div>
          <div id="rows"></div>
          <div id="empty"><svg class="i"><use href="#i-folder" /></svg><b>Folder is Empty</b><span></span></div>
        </div>
        <div id="computer"></div>
        <div id="bubble"></div>
      </main>

      <aside id="pane">
        <div class="grip"></div>
        <div class="hdr"><b></b>
          <button class="ib sm" id="pv-open" title="Open"><svg class="i"><use href="#i-ext" /></svg></button>
          <button class="ib sm" id="pv-close" title="Hide preview (Ctrl+I)"><svg class="i"><use href="#i-x" /></svg></button>
        </div>
        <div id="pv"></div>
      </aside>
    </div>

    <div id="ql"><div class="box"><div class="hdr"><b></b>
      <button class="ib sm" id="ql-open" title="Open"><svg class="i"><use href="#i-ext" /></svg></button>
      <button class="ib sm" id="ql-close" title="Close (Space)"><svg class="i"><use href="#i-x" /></svg></button>
    </div><div id="qlb"></div></div></div>
    <div id="dlg"><div class="box"></div></div>
    <div id="toasts"></div>

    <script src="md.js"></script>
    <script src="app.js"></script>
  </body>
</html>
