# SVG renderer for MW4W Files: resvg built to WebAssembly, run from Go by wazero (svg.go).
# Rebuild: cargo build --release --target wasm32-unknown-unknown && copy the .wasm to ../svg.wasm
[package]
name = "svgwasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
