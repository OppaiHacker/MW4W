# Tag vX.Y.Z -> GitHub release with dist/MW4W-Setup.exe
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build the installer
        run: ./installer/build.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/MW4W-Setup.exe
          generate_release_notes: true
          body: |
            **MW4W-Setup.exe** — download and run. It installs GlazeWM and Zebar (winget) if missing, the MW4W widget pack, wallpapers and colors, and starts everything.

            Options: `MW4W-Setup.exe -NoStart -KeepWallpaper`, uninstall: `MW4W-Setup.exe --uninstall`.
            The exe isn't code-signed, so SmartScreen may ask: *More info → Run anyway*.
