<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>/* preloaded popup: paint nothing until mw4w.js has hidden the window */ (window.__ZEBAR_STATE ?? JSON.parse(sessionStorage.getItem('ZEBAR_STATE') ?? '{}')).openOptions?.preset === 'preload' && document.documentElement.classList.add('preload');</script>
    <link rel="stylesheet" href="colors.css" id="colors" />
    <link rel="stylesheet" href="lib/base.css" />
    <style>
      body {
        padding: 10px;
      }
      .panel {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px 18px 10px;
      }
      header h1 {
        font-size: 17px;
        margin-right: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      header h1 .ic {
        color: var(--primary);
        font-size: 19px;
      }
      #status {
        color: var(--textDim);
        font-size: 12px;
      }
      header button {
        width: 30px;
        height: 30px;
        border-radius: 9px;
      }
      header button:hover {
        background: rgba(var(--primary-rgb), 0.2);
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 0 18px 10px;
      }
      section {
        background: rgba(var(--surface2-rgb), 0.8);
        border-radius: 14px;
        padding: 6px 14px;
        margin-bottom: 12px;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--primary);
        margin: 6px 0 14px 2px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 9px 0;
        border-top: 1px solid rgba(var(--outline-rgb), 0.25);
        font-weight: 500;
      }
      label:first-of-type {
        border-top: 0;
      }
      label small {
        display: block;
        color: var(--textDim);
        font-size: 11px;
        margin-top: 2px;
      }
      label > :last-child {
        flex: none;
      }
      label input[type='text'] {
        width: 300px;
      }
      label select,
      label input[type='number'] {
        width: 160px;
      }
      .range {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .range output {
        width: 42px;
        text-align: right;
        color: var(--textDim);
      }
      input[type='range'] {
        width: 180px;
        accent-color: var(--primary);
      }
      input[type='color'] {
        width: 46px;
        height: 30px;
        border: 0;
        background: none;
        cursor: pointer;
      }
      /* toggle switch */
      input[type='checkbox'] {
        appearance: none;
        width: 42px;
        height: 24px;
        border-radius: 12px;
        background: rgba(var(--surface3-rgb), 1);
        border: 1px solid rgba(var(--outline-rgb), 0.8);
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
      }
      input[type='checkbox']::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--textDim);
        transition: transform 0.18s;
      }
      input[type='checkbox']:checked {
        background: var(--primary);
        border-color: var(--primary);
      }
      input[type='checkbox']:checked::after {
        transform: translateX(18px);
        background: var(--onPrimary);
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 12px 18px 16px;
        border-top: 1px solid rgba(var(--outline-rgb), 0.3);
      }
      footer button {
        padding: 9px 14px;
        border-radius: 10px;
        background: rgba(var(--surface2-rgb), 1);
      }
      footer button:hover {
        background: var(--primary);
        color: var(--onPrimary);
      }
      footer .right {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <header>
        <h1><i class="ic">&#xE713;</i> MW4W Settings</h1>
        <span id="status"></span>
        <button class="ic" id="close" title="Close (Esc)">&#xE711;</button>
      </header>
      <main id="form"></main>
      <footer>
        <button id="keys">Edit keybindings</button>
        <button id="displays">Displays</button>
        <button id="dir">Open config folder</button>
        <button id="reset" class="right">Reset to defaults</button>
      </footer>
    </div>

    <script type="module">
      import { packDir, mw4w, send, open, b64, json, settings, popup, watchState, esc, openPopup } from './lib/mw4w.js';

      const close = popup({ blur: false });

      const S = [
        ['Appearance', [
          ['dynamicColors', 'bool', 'Colors from wallpaper', 'Generate the theme from the current wallpaper (matugen)'],
          ['accent', 'color', 'Accent color', 'Used when colors from wallpaper is off'],
          ['border', 'bool', 'Window borders', 'Colored border on the focused window'],
          ['corners', ['rounded', 'small_rounded', 'square'], 'Window corners'],
          ['hideTitleBars', 'bool', 'Hide title bars', 'Hyprland look - some apps may render oddly'],
          ['inactiveOpacity', [40, 100, 1, '%'], 'Inactive window opacity'],
        ]],
        ['Layout', [
          ['gapsIn', [0, 40, 1, 'px'], 'Gaps between windows'],
          ['gapsOut', [0, 60, 1, 'px'], 'Gaps to screen edge'],
          ['focusFollowsMouse', 'bool', 'Focus follows mouse'],
          ['animations', 'bool', 'Workspace animations', 'Workspaces slide like Hyprland (SUPER+SHIFT+A)'],
        ]],
        ['Status bar', [
          ['clock24h', 'bool', '24 hour clock'],
          ['showMedia', 'bool', 'Media player module'],
          ['showTray', 'bool', 'System tray module'],
          ['dock', 'bool', 'Dock', 'App dock at the bottom of the screen'],
          ['hideTaskbar', 'bool', 'Hide Windows taskbar'],
        ]],
        ['System', [
          ['replaceExplorer', 'bool', 'MW4W as the Windows shell', 'Runs instead of explorer.exe from the next sign-in. No Start menu or taskbar; folders still open'],
          ['filesForFolders', 'bool', 'MW4W Files opens folders', 'Folders open in MW4W Files everywhere, not in Explorer'],
        ]],
        ['Default apps', [
          ['apps.terminal', 'text', 'Terminal', 'SUPER + Enter'],
          ['apps.browser', 'text', 'Browser', 'SUPER + B'],
          ['apps.files', 'text', 'File manager', 'SUPER + E'],
          ['apps.calculator', 'text', 'Calculator', 'SUPER + CTRL + C'],
        ]],
        ['Wallpaper', [
          ['wallpaperDir', 'text', 'Wallpaper folder'],
          ['wallpaperAutoMinutes', 'number', 'Automation interval', 'Minutes between changes (SUPER + ALT + W)'],
        ]],
      ];

      let cfg = await settings();
      const get = k => k.split('.').reduce((o, p) => o?.[p], cfg);
      const status = document.getElementById('status');

      function field([key, type, label, hint]) {
        const v = get(key);
        let input;
        if (type === 'bool') input = `<input type="checkbox" data-k="${key}" ${v ? 'checked' : ''} />`;
        else if (type === 'color') input = `<input type="color" data-k="${key}" value="${esc(v)}" />`;
        else if (type === 'number') input = `<input type="number" min="1" data-k="${key}" value="${esc(v)}" />`;
        else if (type === 'text') input = `<input type="text" spellcheck="false" data-k="${key}" value="${esc(v)}" />`;
        else if (typeof type[0] === 'string') input = `<select data-k="${key}">${type.map(o => `<option ${o === v ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
        else input = `<span class="range"><input type="range" data-k="${key}" min="${type[0]}" max="${type[1]}" step="${type[2]}" value="${v}" /><output>${v}${type[3]}</output></span>`;
        return `<label><span>${esc(label)}${hint ? `<small>${esc(hint)}</small>` : ''}</span>${input}</label>`;
      }

      const form = () => (document.getElementById('form').innerHTML = S.map(([t, fs]) => `<section><h2>${t}</h2>${fs.map(field).join('')}</section>`).join(''));
      form();

      // Debounced save -> mw4w.ps1 set (regenerates colors + GlazeWM config).
      let pending = {};
      let timer;
      function save(key, value) {
        if (key.startsWith('apps.')) pending.apps = { ...cfg.apps, ...pending.apps, [key.slice(5)]: value };
        else pending[key] = value;
        status.textContent = 'Saving…';
        clearTimeout(timer);
        timer = setTimeout(() => {
          send('set', b64(JSON.stringify(pending)));
          pending = {};
        }, 700);
      }
      // a new stamp = mw4w.ps1 set is done (errors: cache\error.log)
      let resetting = false;
      watchState(async (_, changed) => {
        if (!changed) return;
        cfg = await settings();
        status.textContent = 'Saved ✓';
        if (resetting) (resetting = false), form();
      });

      document.getElementById('form').addEventListener('input', e => {
        const el = e.target;
        if (!el.dataset.k) return;
        if (el.type === 'range') el.nextElementSibling.textContent = el.value + el.nextElementSibling.textContent.replace(/[\d.]+/, '');
        const v = el.type === 'checkbox' ? el.checked : el.type === 'range' || el.type === 'number' ? +el.value : el.value;
        // text fields save on change (blur / enter) instead of every keystroke
        if (el.type !== 'text') save(el.dataset.k, v);
      });
      document.getElementById('form').addEventListener('change', e => e.target.type === 'text' && save(e.target.dataset.k, e.target.value));

      document.getElementById('close').onclick = close;
      document.getElementById('keys').onclick = () => mw4w('run', b64(`notepad "${packDir}\\keybinds.json"`));
      document.getElementById('dir').onclick = () => open(packDir);
      document.getElementById('displays').onclick = () => (close(), openPopup('displays'));
      document.getElementById('reset').onclick = async () => {
        resetting = true;
        send('set', b64(JSON.stringify(await json('defaults.json', {}))));
      };
    </script>
  </body>
</html>
