<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="colors.css" />
    <link rel="stylesheet" href="lib/base.css" />
    <style>
      /* ML4W dock: dark glass pill, icon size 36, running dot / focused bar under the icon.
         Pill: 16px from the screen edge, 66px tall (GlazeWM's bottom gap counts on that). */
      :root {
        --ease: cubic-bezier(0.22, 1, 0.36, 1); /* Easing.OutQuint */
      }
      body {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding-bottom: 16px;
        overflow: hidden;
      }
      .pill {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 66px;
        padding: 0 14px;
        isolation: isolate;
        animation: reveal 350ms var(--ease);
      }
      .pill[hidden],
      .pill:has(#apps:empty) {
        display: none;
      }
      @keyframes reveal {
        from {
          transform: translateY(90px);
        }
      }
      /* liquid glass (lib/glass.js) over the wallpaper; this is the fallback until it loads */
      .pill {
        border-radius: 22px;
        background: rgba(var(--surface-rgb), 0.55);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
      }
      button {
        position: relative;
        width: 52px;
        height: 56px;
        display: grid;
        place-items: center;
      }
      /* hover: only the icon grows 12% */
      button > :first-child {
        position: relative;
        transition: transform 300ms var(--ease);
      }
      button:hover > :first-child {
        transform: scale(1.12);
      }
      button > :first-child {
        margin-bottom: 8px;
      }
      img,
      .av {
        width: 36px;
        height: 36px;
        display: block;
      }
      .av {
        border-radius: 8px;
        background: var(--primary);
        color: var(--onPrimary);
        font: 600 17px/36px 'Segoe UI', sans-serif;
        text-align: center;
      }
      /* running indicator, stretches for the focused app */
      .ind {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 5px;
        height: 5px;
        border-radius: 3px;
        background: var(--primary);
        opacity: 0.85;
        transform: translateX(-50%);
        transition: width 350ms var(--ease);
      }
      .active .ind {
        width: 20px;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="pill" id="dock" hidden>
      <div id="apps" style="display: contents"></div>
    </div>
    <script type="module">
      import { zebar, widget, send, b64, settings, watchState, esc } from './lib/mw4w.js';
      import { liquidGlass, wallpaperPlace } from './lib/glass.js';

      if (!(await settings()).dock) widget.close();

      const providers = zebar.createProviderGroup({ glazewm: { type: 'glazewm' } });
      const glaze = (cmd, id) => providers.outputMap.glazewm?.runCommand(cmd, id);
      // window id -> its workspace, filled by render()
      let wsOf = new Map();
      const wsNum = w => parseInt(wsOf.get(w.id)?.name) || 99;
      // GlazeWM's `focus --container-id` doesn't redraw workspaces: a hidden one is
      // switched to first, through winmask so it slides like the keybinds
      const focusWin = id => {
        const ws = wsOf.get(id);
        if (ws && !ws.isDisplayed) return send('slide', b64(`focus --workspace ${ws.name}\nfocus --container-id ${id}`));
        glaze(`focus --container-id ${id}`);
      };
      const dock = document.getElementById('dock');
      const apps = document.getElementById('apps');
      liquidGlass(dock, { place: wallpaperPlace('bottom'), radius: 22, bezel: 14, strength: 11, tint: 'rgba(var(--surface-rgb), 0.38)' }).setSource(
        `cache/glass.jpg?v=${Date.now()}`,
      );

      watchState((st, changed) => {
        if (changed) return location.reload();
        // game mode / bar hidden: GlazeWM drops the bottom gap, so get out of the way
        dock.hidden = st.gamemode || st.barHidden;
      });

      // Icons: cache/icons/proc-<name>.png (64px), made on demand by `mw4w.ps1 winicons`.
      // A missing icon shows the letter, asks for it once and swaps it in as soon as the png exists.
      let iconVer = 0;
      const probing = new Set();
      const noIcons = new Set();
      window.noIcon = img => {
        const src = img.src.split('?')[0];
        img.outerHTML = `<div class="av">${esc(img.alt[0]?.toUpperCase() ?? '?')}</div>`;
        if (probing.has(src) || noIcons.has(src)) return;
        probing.add(src);
        send('winicons');
        let n = 0;
        const p = new Image();
        p.onload = () => (probing.delete(src), iconVer++, render());
        // ponytail: poll 300ms x 20, then the letter stays (elevated apps hide their exe path)
        p.onerror = () => (++n < 20 ? setTimeout(() => (p.src = `${src}?t=${Date.now()}`), 300) : (probing.delete(src), noIcons.add(src)));
        p.src = `${src}?t=${Date.now()}`;
      };

      // One button per app (process), like mw4w-dock groups windows by app.
      let groups = new Map();
      let html;
      function render() {
        const g = providers.outputMap.glazewm;
        if (!g) return;
        groups = new Map();
        wsOf = new Map();
        const walk = (c, ws) => (c.type === 'window' ? wsOf.set(c.id, ws) : c.children?.forEach(x => walk(x, ws)));
        for (const ws of g.allWorkspaces ?? []) walk(ws, ws);
        for (const w of g.allWindows ?? []) {
          const k = w.processName.toLowerCase();
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push(w);
        }
        // in workspace order: an app sits at its lowest workspace
        const next = [...groups]
          .sort((a, b) => Math.min(...a[1].map(wsNum)) - Math.min(...b[1].map(wsNum)))
          .map(([k, ws]) => {
            const title = ws.length > 1 ? `${ws[0].processName} (${ws.length})` : ws[0].title;
            return (
              `<button class="${ws.some(w => w.hasFocus) ? 'active' : ''}" data-app="${esc(k)}" title="${esc(title)}">` +
              `<img src="cache/icons/proc-${esc(k)}.png?v=${iconVer}" alt="${esc(ws[0].processName)}" onerror="noIcon(this)" />` +
              `<span class="ind"></span></button>`
            );
          })
          .join('');
        if (next !== html) apps.innerHTML = html = next;
      }
      providers.onOutput(render);
      render();

      const appOf = e => groups.get(e.target.closest('[data-app]')?.dataset.app);

      document.addEventListener('click', e => {
        const ws = appOf(e);
        if (!ws) return;
        // click cycles through the app's windows
        const i = ws.findIndex(w => w.hasFocus);
        focusWin(ws[(i + 1) % ws.length].id);
      });

      // middle click closes the app's focused (or first) window
      document.addEventListener('auxclick', e => {
        const ws = e.button === 1 && appOf(e);
        if (ws) glaze('close', (ws.find(w => w.hasFocus) ?? ws[0]).id);
      });
      document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
  </body>
</html>
