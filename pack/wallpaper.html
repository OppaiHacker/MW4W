<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>/* preloaded popup: paint nothing until mw4w.js has hidden the window */ (window.__ZEBAR_STATE ?? JSON.parse(sessionStorage.getItem('ZEBAR_STATE') ?? '{}')).openOptions?.preset === 'preload' && document.documentElement.classList.add('preload');</script>
    <link rel="stylesheet" href="colors.css" />
    <link rel="stylesheet" href="lib/base.css" />
    <style>
      body {
        padding: 10px;
      }
      .panel {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header h1 {
        font-size: 16px;
        margin-right: auto;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      header h1 .ic {
        color: var(--primary);
        font-size: 18px;
      }
      header button {
        display: flex;
        gap: 7px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(var(--surface2-rgb), 1);
      }
      header button:hover,
      header button.on {
        background: var(--primary);
        color: var(--onPrimary);
      }
      #grid {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        align-content: start;
        padding: 2px;
      }
      .wp {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        border: 3px solid transparent;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .wp img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .wp span {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 14px 8px 5px;
        font-size: 11px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .wp:hover,
      .wp.sel {
        transform: scale(1.03);
        border-color: rgba(var(--primary-rgb), 0.6);
      }
      .wp.cur {
        border-color: var(--primary);
      }
      .empty {
        grid-column: 1 / -1;
        color: var(--textDim);
        padding: 40px;
        text-align: center;
      }
      #busy {
        position: absolute;
        inset: 10px;
        display: none;
        place-items: center;
        border-radius: 18px;
        background: rgba(var(--surface-rgb), 0.6);
        font-size: 15px;
      }
      #busy.on {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <header>
        <h1><i class="ic">&#xE91B;</i> Wallpapers</h1>
        <button id="random"><i class="ic">&#xE8B1;</i> Random</button>
        <button id="auto"><i class="ic">&#xE895;</i> Auto</button>
        <button id="folder"><i class="ic">&#xE8B7;</i> Folder</button>
      </header>
      <div id="grid"></div>
    </div>
    <div id="busy">Applying wallpaper &amp; generating colors…</div>

    <script type="module">
      import { mw4w, send, b64, json, settings, popup, preloaded, watchState, esc } from './lib/mw4w.js';

      popup();
      const grid = document.getElementById('grid');
      const busy = document.getElementById('busy');
      const s = await settings();
      let list = [];
      let sel = 0;
      let current = '';

      watchState(st => {
        busy.classList.remove('on'); // a new stamp: the wallpaper command is done
        current = st.wallpaper ?? '';
        document.getElementById('auto').classList.toggle('on', !!st.autoPid);
        render();
      });

      function render() {
        grid.innerHTML = list.length
          ? list
              .map(
                (w, i) =>
                  `<div class="wp ${w.path === current ? 'cur' : ''} ${i === sel ? 'sel' : ''}" data-i="${i}"><img src="${w.thumb}" loading="lazy" /><span>${esc(w.name)}</span></div>`,
              )
              .join('')
          : `<div class="empty">No wallpapers yet in ${esc(s.wallpaperDir)}<br />Put .jpg / .png files there.</div>`;
        grid.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
      }

      function apply(arg) {
        busy.classList.add('on');
        send('wallpaper', arg); // state stamp changes -> new colors, busy off
      }

      list = await json('cache/wallpapers.json', []);
      sel = Math.max(0, list.findIndex(w => w.path === current));
      render();
      // new files in the folder: thumbnails in the background on every show
      const refresh = () =>
        mw4w('thumbs').then(async () => {
          list = await json('cache/wallpapers.json', []);
          render();
        });
      addEventListener('focus', refresh);
      if (!preloaded) refresh(); // startup makes the thumbnails already

      grid.addEventListener('click', e => {
        const w = e.target.closest('.wp');
        if (w) apply(list[+w.dataset.i].path);
      });
      document.getElementById('random').onclick = () => apply('random');
      document.getElementById('auto').onclick = () => send('wallpaper-auto');
      // cmd expands %USERPROFILE% etc.
      document.getElementById('folder').onclick = () => mw4w('run', b64(`explorer "${s.wallpaperDir}"`));

      addEventListener('keydown', e => {
        const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 4, ArrowUp: -4 }[e.key];
        if (step) {
          sel = Math.max(0, Math.min(list.length - 1, sel + step));
          render();
          e.preventDefault();
        } else if (e.key === 'Enter' && list[sel]) apply(list[sel].path);
      });
    </script>
  </body>
</html>
