<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="colors.css" />
    <link rel="stylesheet" href="lib/base.css" />
    <style>
      /* ML4W Quickshell status bar: one floating glass pill, everything in the accent color */
      body {
        padding: 6px 8px 0;
        font: 700 13px/1 'Fira Sans', 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
        color: var(--primary);
      }
      .bar {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(max-content, 1fr);
        align-items: center;
        gap: 16px;
        height: 40px;
        padding: 0 16px 0 18px;
        border-radius: 20px;
        isolation: isolate;
      }
      /* liquid glass (lib/glass.js) over the wallpaper; this is the fallback until it loads */
      .bar {
        background: rgba(var(--surface-rgb), 0.55);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      .side {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }
      .right {
        justify-content: flex-end;
        gap: 22px;
      }
      .center {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .svg {
        display: block;
        flex: none;
      }
      /* plain accent icon / icon+text modules */
      .i {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: none;
        white-space: nowrap;
        cursor: pointer;
        transition:
          color 0.2s,
          transform 0.2s;
      }
      .i:hover {
        color: var(--text);
      }
      .i:active {
        transform: scale(0.92);
      }
      .i.on {
        color: var(--onPrimary);
        background: var(--primary);
        border-radius: 8px;
        padding: 3px 5px;
        margin: -3px -5px;
      }
      .i[hidden] {
        display: none;
      }
      /* workspaces: 1..10 as circles */
      .ws {
        display: flex;
        gap: 6px;
        flex: none;
      }
      .ws button {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font: 700 12px/1 'Fira Sans', 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
        color: rgba(var(--text-rgb), 0.55);
        border: 1.5px solid rgba(var(--outline-rgb), 0.7);
        transition: all 0.25s ease;
      }
      .ws button.busy {
        color: var(--text);
        border-color: rgba(var(--text-rgb), 0.85);
      }
      .ws button.shown:not(.focus) {
        border-color: var(--primary);
      }
      .ws button.focus {
        color: var(--onPrimary);
        background: var(--primary);
        border-color: var(--primary);
      }
      .ws button.here:not(.focus) {
        color: var(--text);
        background: rgba(var(--primary-rgb), 0.3);
        border-color: var(--primary);
      }
      .ws button:not(.focus):hover {
        background: rgba(var(--primary-rgb), 0.25);
        color: var(--text);
      }
      /* MediaControll capsule (StatusbarApp/MediaModule.qml): BlurArt + GlassPanel + MiniRow */
      .cap {
        position: relative;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        min-width: 0;
        padding: 0 10px;
        border-radius: 15px;
        overflow: hidden;
        isolation: isolate;
        color: #fff;
        cursor: pointer;
        /* BlurArt base: primary_container -> surface */
        background: linear-gradient(color-mix(in srgb, var(--primary) 30%, var(--surface)), var(--surface));
      }
      .cap[hidden] {
        display: none;
      }
      /* the blurred cover, oversized so the soft edges fall outside */
      .cap .tint {
        position: absolute;
        inset: -20%;
        z-index: -1;
        background-size: cover;
        background-position: center;
        filter: blur(12px) saturate(1.9);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .cap.art .tint {
        opacity: 1;
      }
      /* GlassPanel (tintAlpha 0): rim, specular top line, accent glow line, sheen; over BlurArt's dimming */
      .cap::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.16);
        pointer-events: none;
        background:
          linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7) 30% 70%, transparent) top center / calc(100% - 30px) 1px no-repeat,
          linear-gradient(90deg, transparent, rgba(var(--primary-rgb), 0.8), transparent) bottom center / calc(100% - 30px) 1px no-repeat,
          linear-gradient(rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.03) 45%, rgba(var(--primary-rgb), 0.1)),
          linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.4));
      }
      .cover {
        width: 22px;
        height: 22px;
        flex: none;
        border-radius: 50%;
        overflow: hidden;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.08);
      }
      .cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ttl {
        min-width: 0;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 400;
      }
      /* Equalizer: three bars bouncing from the bottom, frozen and dimmed while paused */
      .eq {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
        flex: none;
        opacity: 0.4;
        transition: opacity 0.3s;
      }
      .playing .eq {
        opacity: 1;
      }
      .eq i {
        width: 3px;
        height: 3.6px;
        border-radius: 1.5px;
        background: currentColor;
        transition: height 0.3s;
      }
      .playing .eq i {
        animation: eq 260ms ease-in-out infinite alternate;
        --h: 6.6px;
      }
      .playing .eq i:nth-child(2) {
        animation-duration: 330ms;
        animation-delay: 90ms;
        --h: 10.8px;
      }
      .playing .eq i:nth-child(3) {
        animation-duration: 400ms;
        animation-delay: 180ms;
        --h: 8.4px;
      }
      @keyframes eq {
        to {
          height: var(--h);
        }
      }
      .wtitle {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
        color: rgba(var(--text-rgb), 0.75);
      }
      /* clock: time over date */
      .clock {
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: default;
      }
      .clock b {
        font-size: 16px;
        letter-spacing: 0.3px;
      }
      .clock small {
        font-size: 10px;
        font-weight: 600;
        opacity: 0.8;
      }
      /* binding mode / paused / game mode */
      .tags {
        display: flex;
        gap: 6px;
      }
      .tags span {
        padding: 4px 8px;
        border-radius: 8px;
        background: var(--error);
        color: #1a1a1a;
        cursor: pointer;
      }
      /* tray: hover to open, like a waybar drawer */
      .drawer {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .drawer:has(.tray:empty) {
        display: none;
      }
      .tray {
        display: flex;
        gap: 10px;
        max-width: 0;
        overflow: hidden;
        opacity: 0;
        transition: all 0.3s ease-out;
      }
      .drawer:hover .tray {
        max-width: 600px;
        opacity: 1;
      }
      .tray img {
        width: 17px;
        height: 17px;
        display: block;
        cursor: pointer;
      }
      .logo {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: var(--onPrimary);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="side">
        <span class="i" data-act="terminal" title="Terminal (SUPER+Enter)" id="term"></span>
        <div class="ws" id="ws"></div>
        <div class="cap" id="cap" hidden title="Left: play/pause · Right: next · Middle: previous">
          <span class="tint" id="capTint"></span>
          <span class="cover" id="capCover"></span>
          <span class="ttl" id="capTitle"></span>
          <span class="eq"><i></i><i></i><i></i></span>
        </div>
        <span class="wtitle" id="title"></span>
      </div>

      <div class="center">
        <span class="i" data-act="launcher" title="Left: Apps (SUPER+CTRL+Enter)&#10;Right: Keybindings" id="grid"></span>
        <div class="clock" id="clock" data-act="clock"><b></b><small></small></div>
        <span class="i" data-act="notifications" title="Notifications" id="bell"></span>
      </div>

      <div class="side right">
        <div class="tags" id="tags"></div>
        <span class="i" data-act="timer" title="Timer" id="timer"></span>
        <span class="i" data-act="updates" title="Updates" id="upd"></span>
        <span class="i" data-act="gamemode" title="Game mode (SUPER+ALT+G)" id="game"></span>
        <span class="i" data-act="volume" id="vol"></span>
        <span class="i" data-act="network" id="net"></span>
        <span class="i" data-act="battery" id="bat" hidden></span>
        <div class="drawer"><div class="tray" id="tray"></div><span class="i" id="trayic" title="Tray"></span></div>
        <span class="i" data-act="settings" title="Left: MW4W Settings (SUPER+CTRL+S)&#10;Right: Wallpaper (SUPER+CTRL+W)"><span class="logo">mw.</span></span>
        <span class="i" data-act="power" title="Power menu (SUPER+CTRL+P)" id="pwr"></span>
      </div>
    </div>

    <script type="module">
      import { zebar, widget, send, open, glaze as glazeCmd, openPopup as popup, settings, watchState, json, esc } from './lib/mw4w.js';
      import { svg, volIcon, track } from './lib/icons.js';
      import { liquidGlass, wallpaperPlace } from './lib/glass.js';

      const s = await settings();
      document.body.style.paddingInline = `${s.gapsOut}px`;
      liquidGlass(document.querySelector('.bar'), {
        place: wallpaperPlace('top'),
        radius: 20,
        bezel: 10,
        strength: 8,
        tint: 'rgba(var(--surface-rgb), 0.74)',
      }).setSource(`cache/glass.jpg?v=${Date.now()}`);
      const $ = id => document.getElementById(id);
      let state = {};

      for (const [id, name, size] of [
        ['term', 'terminal', 18],
        ['grid', 'grid', 18],
        ['bell', 'bell', 18],
        ['timer', 'timer', 18],
        ['game', 'rocket', 18],
        ['trayic', 'chevron', 16],
        ['pwr', 'power', 18],
      ])
        $(id).innerHTML = svg(name, size);

      watchState((st, changed) => {
        if (st.barHidden) return widget.close();
        if (changed) return location.reload();
        state = st;
        $('game').classList.toggle('on', !!st.gamemode);
      });

      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        network: { type: 'network', refreshInterval: 5000 },
        battery: { type: 'battery', refreshInterval: 15000 },
        audio: { type: 'audio' },
        time: { type: 'date', formatting: s.clock24h ? 'HH:mm' : 'h:mm a' },
        day: { type: 'date', formatting: 'EEE, d MMM', refreshInterval: 60000 },
        long: { type: 'date', formatting: 'EEEE, d MMMM yyyy', refreshInterval: 60000 },
        ...(s.showMedia ? { media: { type: 'media' } } : {}),
        ...(s.showTray ? { systray: { type: 'systray' } } : {}),
      });

      const set = (id, html) => {
        const el = $(id);
        if (el._html !== html) el.innerHTML = el._html = html;
      };

      // cover art, app and volume from `mw4w.ps1 media-loop`
      let extra = null;
      if (s.showMedia) {
        const poll = async () => {
          const next = await json('cache/media.json', null);
          if (JSON.stringify(next) !== JSON.stringify(extra)) (extra = next), render();
        };
        poll();
        setInterval(poll, 1000);
      }

      // updates count (winget), refreshed every 2 hours
      let updates = null;
      const pollUpdates = async () => {
        updates = await json('cache/updates.json', null);
        if (!updates || Date.now() / 1000 - updates.at > 7200) send('updates');
        render();
      };
      pollUpdates();
      setInterval(pollUpdates, 10 * 60 * 1000);

      function render() {
        const o = providers.outputMap;
        const g = o.glazewm;

        if (g) {
          // persistent workspaces 1..10, like ML4W
          set(
            'ws',
            Array.from({ length: 10 }, (_, i) => {
              const n = String(i + 1);
              const w = g.allWorkspaces.find(w => w.name === n);
              // here: shown on this bar's monitor (each monitor has its own bar)
              const here = w && w.id === g.displayedWorkspace?.id;
              const cls = [w?.hasFocus && 'focus', here && 'here', w?.isDisplayed && 'shown', w?.children?.length && 'busy'].filter(Boolean).join(' ');
              return `<button class="${cls}" data-ws="${n}">${n}</button>`;
            }).join(''),
          );
        }

        // media capsule; the window title takes its place when nothing plays
        const t = track(o.media?.currentSession, extra);
        const cap = $('cap');
        cap.hidden = !t;
        if (t) {
          cap.classList.toggle('playing', t.playing);
          cap.classList.toggle('art', !!t.cover);
          set('capTitle', esc(t.title));
          set('capCover', t.cover ? `<img src="${esc(t.cover)}" />` : svg('music', 13));
          const tint = t.cover ? `url("${t.cover}")` : '';
          if ($('capTint').style.backgroundImage !== tint) $('capTint').style.backgroundImage = tint;
        }
        // this monitor's window: the focused one, or the last focused on the workspace shown here
        let f = g?.focusedContainer;
        if (g && g.currentMonitor?.id !== g.focusedMonitor?.id)
          for (f = g.displayedWorkspace; f && f.type !== 'window'; )
            f = f.children?.find(c => c.id === f.childFocusOrder?.[0]) ?? f.children?.[0];
        set('title', !t && f?.type === 'window' ? esc(f.title.replace(/ [-—–] [^-—–]+$/, '') || f.processName) : '');

        set('clock', `<b>${esc(o.time?.formatted)}</b><small>${esc(o.day?.formatted)}</small>`);
        $('clock').title = o.long?.formatted ?? '';

        let tags = '';
        if (g) {
          for (const m of g.bindingModes) tags += `<span data-act="mode" data-mode="${esc(m.name)}">${esc(m.displayName ?? m.name)}</span>`;
          if (g.isPaused) tags += `<span data-act="pause">paused</span>`;
        }
        set('tags', tags);

        set('upd', svg('box', 18) + (updates?.count ? `<span>${updates.count}</span>` : ''));
        $('upd').title = updates ? `${updates.count} updates (winget) — click to install` : 'Updates (winget)';

        const a = o.audio?.defaultPlaybackDevice;
        set('vol', a ? svg(volIcon(a.volume, a.isMuted), 18) + `<span>${a.isMuted ? 'muted' : Math.round(a.volume) + '%'}</span>` : '');
        $('vol').title = a ? `${a.name} — click: sound panel, scroll: volume, right click: mute` : '';

        const n = o.network;
        if (n) {
          const type = n.defaultInterface?.type;
          set('net', svg(type === 'wifi' ? 'wifi' : type ? 'lan' : 'offline', 17));
          $('net').title =
            type === 'wifi' ? `${n.defaultGateway?.ssid ?? ''} ${n.defaultGateway?.signalStrength ?? ''}%` : (n.defaultInterface?.friendlyName ?? 'Disconnected');
        }

        const b = o.battery;
        $('bat').hidden = !b || b.state === 'unknown';
        if (b && b.state !== 'unknown') {
          const p = Math.round(b.chargePercent);
          set('bat', svg(b.isCharging ? 'charging' : 'battery', 18) + `<span>${p}%</span>`);
          $('bat').style.color = p < 15 && !b.isCharging ? 'var(--error)' : '';
        }

        set('tray', (o.systray?.icons ?? []).map(t => `<img src="${t.iconUrl}" title="${esc(t.tooltip)}" data-tray="${esc(t.id)}" />`).join(''));
      }

      providers.onOutput(render);
      render();

      const glaze = (cmd, id) => providers.outputMap.glazewm?.runCommand(cmd, id);
      const media = () => providers.outputMap.media;

      // ---- hover: the capsule opens the dynamic island (island.html) right on top of itself
      const wins = {};
      async function findWin(name) {
        const title = `Zebar - mw4w / ${name}`;
        try {
          if (wins[name] && (await wins[name].title()) === title) return wins[name];
        } catch {}
        for (const w of await widget.tauriWindow.constructor.getAll()) if ((await w.title()) === title) return (wins[name] = w);
        return null;
      }
      async function openIsland() {
        const win = widget.tauriWindow;
        const island = await findWin('island');
        if (!island) return zebar.startWidgetPreset('island', 'preload');
        const [pos, size, sf] = await Promise.all([win.outerPosition(), win.outerSize(), win.scaleFactor()]);
        const r = $('cap').getBoundingClientRect();
        const W = 440; // island.html window: 420px island + shadow
        // x, y: bar CSS px. Placed in physical px: a Logical position would be scaled by the
        // island's current monitor, which differs from the bar's with mixed DPI.
        const x = Math.round(Math.max(0, Math.min(size.width / sf - W, r.left + r.width / 2 - W / 2)));
        const y = 4;
        // where the capsule is inside the island window: the island grows out of it
        localStorage.setItem('mw4w.island', JSON.stringify({ t: Date.now(), w: r.width, h: r.height, cx: r.left + r.width / 2 - x, top: r.top - y }));
        await island.setPosition({ type: 'Physical', x: Math.round(pos.x + x * sf), y: Math.round(pos.y + y * sf) });
        await island.show();
      }
      // ---- quick panels (quick.html) drop down under their icon: sound, network, power, calendar
      async function openQuick(panel, el) {
        const last = JSON.parse(localStorage.getItem('mw4w.quick.closed') ?? '{}');
        // this click took the focus from the open panel (which closed itself): it was meant to close it
        if (last.panel === panel && Date.now() - last.t < 350) return;
        const win = widget.tauriWindow;
        const q = await findWin('quick');
        if (!q) return zebar.startWidgetPreset('quick', 'preload');
        const [pos, size, sf] = await Promise.all([win.outerPosition(), win.outerSize(), win.scaleFactor()]);
        const r = el.getBoundingClientRect();
        const W = 408; // quick.html window: 360px panel + 24px margins (room for its shadow)
        // x, y: bar CSS px from the monitor's corner (the bar spans it), which is what quick.html's
        // glass needs; placed in physical px, like the island
        const cx = r.left + r.width / 2;
        const x = Math.round(Math.max(-14, Math.min(size.width / sf - W + 14, cx - W / 2)));
        const y = Math.round(r.bottom - 2);
        localStorage.setItem('mw4w.quick', JSON.stringify({ t: Date.now(), panel, x, y, ox: Math.round(cx - x - 24) }));
        await q.setPosition({ type: 'Physical', x: Math.round(pos.x + x * sf), y: Math.round(pos.y + y * sf) });
        await q.show();
      }

      // GlazeWM opens a new workspace on the focused monitor: focus this bar's monitor first, like Hyprland
      async function focusWs(n) {
        const g = providers.outputMap.glazewm;
        const here = g?.displayedWorkspace;
        if (here && !here.hasFocus && !g.allWorkspaces.some(w => w.name === n)) await glaze(`focus --workspace ${here.name}`);
        return glaze(`focus --workspace ${n}`);
      }

      let hoverTimer;
      $('cap').addEventListener('mouseenter', () => (hoverTimer = setTimeout(openIsland, 220)));
      $('cap').addEventListener('mouseleave', () => clearTimeout(hoverTimer));

      document.addEventListener('click', e => {
        if (e.target.closest('#cap')) return media()?.togglePlayPause();
        const el = e.target.closest('[data-act],[data-ws],[data-tray]');
        if (!el) return;
        if (el.dataset.ws) return focusWs(el.dataset.ws);
        if (el.dataset.tray) return providers.outputMap.systray?.onLeftClick(el.dataset.tray);
        const o = providers.outputMap;
        switch (el.dataset.act) {
          case 'launcher':
          case 'settings':
          case 'power':
            return popup(el.dataset.act);
          case 'terminal':
            return glazeCmd(`shell-exec ${s.apps.terminal}`);
          case 'mode':
            return glaze(`wm-disable-binding-mode --name ${el.dataset.mode}`);
          case 'pause':
            return glaze('wm-toggle-pause');
          case 'gamemode':
            return send('gamemode');
          case 'notifications':
            return open('ms-actioncenter:');
          case 'timer':
            return open('ms-clock:');
          case 'updates':
            return send('run', btoa('winget upgrade --all'));
          case 'network':
            return openQuick('network', el);
          case 'battery':
            return openQuick('battery', el);
          case 'volume':
            return openQuick('audio', el);
          case 'clock':
            return openQuick('calendar', el);
        }
      });

      document.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (e.target.closest('#cap')) return media()?.next();
        const el = e.target.closest('[data-tray],[data-act]');
        if (el?.dataset.tray) providers.outputMap.systray?.onRightClick(el.dataset.tray);
        else if (el?.dataset.act === 'volume') {
          const d = providers.outputMap.audio?.defaultPlaybackDevice;
          if (d) providers.outputMap.audio.setMute(!d.isMuted);
        } else if (el?.dataset.act === 'network') open('ms-settings:network');
        else if (el?.dataset.act === 'launcher') popup('keybinds');
        else if (el?.dataset.act === 'settings') popup('wallpaper');
      });

      document.addEventListener('auxclick', e => {
        if (e.button !== 1) return;
        if (e.target.closest('#cap')) return media()?.previous();
        const el = e.target.closest('[data-tray]');
        if (el) providers.outputMap.systray.onMiddleClick(el.dataset.tray);
      });

      document.addEventListener(
        'wheel',
        e => {
          const up = e.deltaY < 0;
          if (e.target.closest('#ws')) return glaze(up ? 'focus --prev-active-workspace' : 'focus --next-active-workspace');
          if (e.target.closest('#vol')) {
            const o = providers.outputMap;
            const d = o.audio?.defaultPlaybackDevice;
            if (d) o.audio.setVolume(Math.max(0, Math.min(100, d.volume + (up ? 2 : -2))));
          }
        },
        { passive: true },
      );
    </script>
  </body>
</html>
