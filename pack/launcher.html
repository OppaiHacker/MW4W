<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>/* preloaded popup: paint nothing until mw4w.js has hidden the window */ (window.__ZEBAR_STATE ?? JSON.parse(sessionStorage.getItem('ZEBAR_STATE') ?? '{}')).openOptions?.preset === 'preload' && document.documentElement.classList.add('preload');</script>
    <link rel="stylesheet" href="colors.css" />
    <link rel="stylesheet" href="lib/base.css" />
    <style>
      /* ML4W's rofi (config.rasi): 900px window, 3px border, radius 10; the wallpaper fills it,
         left "imagebox" (search on top, mode switcher at the bottom), right the list, 8 lines */
      body {
        padding: 10px;
      }
      .panel {
        height: 100%;
        display: flex;
        border: 3px solid var(--primary);
        border-radius: 10px;
        overflow: hidden;
        background: var(--surface) center / cover no-repeat;
      }
      .imagebox {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px;
        min-width: 0;
      }
      .inputbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px;
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
      }
      .inputbar .ic {
        font-size: 15px;
      }
      #q {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        padding: 0;
        background: none;
        font-size: 14px;
      }
      #q::placeholder {
        color: var(--text);
        opacity: 1;
      }
      .modes {
        display: flex;
        gap: 12px;
      }
      .modes button {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
      }
      .modes button.on {
        background: var(--primary);
        color: var(--onPrimary);
      }
      .listbox {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 10px;
        background: var(--surface);
      }
      #list {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: none;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px;
        margin: 5px;
        height: 52px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--text);
      }
      .row.sel {
        background: var(--primary);
        color: var(--onPrimary);
      }
      .row img,
      .row .av {
        width: 32px;
        height: 32px;
        flex: none;
      }
      .row .av {
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: rgba(var(--primary-rgb), 0.25);
        color: var(--primary);
        font-weight: 800;
      }
      .row.sel .av {
        background: rgba(var(--onPrimary-rgb), 0.18);
        color: var(--onPrimary);
      }
      .row .av.ic {
        font-size: 17px;
      }
      .row .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .sub {
        margin-left: auto;
        opacity: 0.65;
        font-size: 11.5px;
        font-weight: 500;
        white-space: nowrap;
        max-width: 45%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div class="panel" id="panel">
      <div class="imagebox">
        <div class="inputbar">
          <i class="ic">&#xE721;</i>
          <input id="q" type="text" placeholder="Search" autocomplete="off" spellcheck="false" autofocus />
        </div>
        <div class="modes">
          <button data-mode="apps">Apps</button>
          <button data-mode="mw4w">MW4W</button>
          <button data-mode="windows">Windows</button>
          <button data-mode="run">Run</button>
        </div>
      </div>
      <div class="listbox"><div id="list"></div></div>
    </div>

    <script type="module">
      import { zebar, packDir, mw4w, send, b64, json, popup, openPopup, score, esc } from './lib/mw4w.js';

      // fresh for the next show: empty search, apps mode, current app cache
      const close = popup({
        onHide: async () => {
          q.value = '';
          mode = 'apps';
          sel = 0;
          apps = await json('cache/apps.json', apps);
          render();
          q.focus();
        },
      });
      const q = document.getElementById('q');
      const list = document.getElementById('list');
      const MODES = ['apps', 'mw4w', 'windows', 'run'];
      let mode = 'apps';
      let apps = await json('cache/apps.json', []);
      let items = [];
      let sel = 0;

      // the wallpaper behind it all, like ML4W's current_wallpaper image
      document.getElementById('panel').style.backgroundImage = `url("cache/glass.jpg?v=${Date.now()}")`;

      const glaze = zebar.createProvider({ type: 'glazewm' });

      // MW4W's own apps (the "MW4W" tab): [name, Segoe Fluent glyph, description, action, icon]
      const OWN = [
        ['Files', 'E8B7', 'File manager · SUPER+E', () => glaze.output?.runCommand(`shell-exec ${packDir}\\bin\\mw4w-files.exe`), 'lib/files.svg'],
        ['Displays', 'E7F4', 'Screens, layout, workspaces per screen · SUPER+CTRL+M', () => openPopup('displays')],
        ['Settings', 'E713', 'MW4W settings · SUPER+CTRL+S', () => openPopup('settings')],
        ['Keybindings', 'E765', 'Cheat sheet · SUPER+CTRL+K', () => openPopup('keybinds')],
        ['Wallpapers', 'E91B', 'Wallpaper selector · SUPER+CTRL+W', () => openPopup('wallpaper')],
        ['Power menu', 'E7E8', 'Lock, sleep, restart · SUPER+CTRL+Q', () => openPopup('power')],
        ['Game mode', 'E7FC', 'No gaps, borders or animations · SUPER+ALT+G', () => send('gamemode')],
        ['Toggle status bar', 'E8A0', 'SUPER+CTRL+B', () => send('bar-toggle')],
        ['Reload MW4W', 'E72C', 'Regenerate the config · SUPER+SHIFT+R', () => send('apply')],
      ];

      let uses = {};
      try {
        uses = JSON.parse(localStorage.getItem('uses') || '{}');
      } catch {}
      const bump = id => {
        uses[id] = (uses[id] || 0) + 1;
        try {
          localStorage.setItem('uses', JSON.stringify(uses));
        } catch {}
      };

      // Refresh the app cache in the background (new installs show up next time).
      if (!apps.length) mw4w('cache').then(async () => ((apps = await json('cache/apps.json', [])), render()));

      function rows() {
        const text = q.value.trim();
        if (mode === 'apps') {
          return apps
            .map(a => ({ a, m: score(a.name, text) }))
            .filter(x => x.m >= 0)
            .map(({ a, m }) => ({ a, s: m + Math.min(uses[a.id] || 0, 50) * (text ? 2 : 20) }))
            .sort((x, y) => y.s - x.s || x.a.name.localeCompare(y.a.name))
            .slice(0, 60)
            .map(({ a }) => ({ kind: 'app', id: a.id, name: a.name, icon: a.icon }));
        }
        if (mode === 'mw4w') {
          return OWN.map(([name, glyph, sub, run, icon]) => ({ kind: 'own', name, glyph, sub, run, icon, s: Math.max(score(name, text), score(sub, text)) }))
            .filter(x => x.s >= 0)
            .sort((x, y) => (text ? y.s - x.s : 0));
        }
        if (mode === 'windows') {
          return (glaze.output?.allWindows ?? [])
            .map(w => ({ w, s: Math.max(score(w.title, text), score(w.processName, text)) }))
            .filter(x => x.s >= 0)
            .sort((x, y) => y.s - x.s)
            .map(({ w }) => ({ kind: 'win', id: w.id, name: w.title || w.processName, sub: w.processName }));
        }
        return text ? [{ kind: 'run', name: text, sub: 'Run command' }] : [];
      }

      function render() {
        items = rows();
        if (!items.length && mode === 'apps' && q.value.trim()) items = [{ kind: 'run', name: q.value.trim(), sub: 'Run command' }];
        sel = Math.min(sel, Math.max(0, items.length - 1));
        list.innerHTML = items
          .map((it, i) => {
            const pic = it.icon
              ? `<img src="${it.icon}" onerror="this.outerHTML='<div class=av>${esc(it.name[0] ?? '?')}</div>'" />`
              : `<div class="av ic">&#x${it.glyph ?? (it.kind === 'win' ? 'E7C4' : 'E756')};</div>`;
            return `<div class="row ${i === sel ? 'sel' : ''}" data-i="${i}">${pic}<span class="name">${esc(it.name)}</span>${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</div>`;
          })
          .join('');
        document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
        q.placeholder = { apps: 'Search', mw4w: 'Search MW4W', windows: 'Search windows', run: 'Command to run' }[mode];
        list.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
      }

      async function activate(it) {
        if (!it) return;
        await close(); // hide first: never wait on the app starting
        if (it.kind === 'app') {
          bump(it.id);
          zebar.shellExec('explorer', [`shell:AppsFolder\\${it.id}`]);
        } else if (it.kind === 'own') {
          it.run();
        } else if (it.kind === 'win') {
          // `focus --container-id` doesn't redraw workspaces: a hidden one is switched to first, sliding (winmask)
          const ws = glaze.output?.allWorkspaces.find(w => JSON.stringify(w).includes(it.id));
          if (ws && !ws.isDisplayed) send('slide', b64(`focus --workspace ${ws.name}\nfocus --container-id ${it.id}`));
          else glaze.output?.runCommand(`focus --container-id ${it.id}`);
        } else if (glaze.output) {
          glaze.output.runCommand(`shell-exec ${it.name}`); // instant, like Win+R
        } else {
          mw4w('run', b64(it.name));
        }
      }

      const setMode = m => ((mode = m), (sel = 0), render(), q.focus());

      q.addEventListener('input', () => ((sel = 0), render()));
      // the search box never loses the keyboard: typing and arrows work together, also after a click
      addEventListener('focus', () => q.focus());
      addEventListener('mousedown', e => e.target !== q && e.preventDefault());
      addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') sel = Math.min(sel + 1, items.length - 1);
        else if (e.key === 'ArrowUp') sel = Math.max(sel - 1, 0);
        else if (e.key === 'Enter') return activate(items[sel]);
        else if (e.key === 'Tab') {
          e.preventDefault();
          const n = MODES.length;
          return setMode(MODES[(MODES.indexOf(mode) + (e.shiftKey ? n - 1 : 1)) % n]);
        } else return;
        e.preventDefault();
        render();
      });
      list.addEventListener('click', e => {
        const r = e.target.closest('.row');
        if (r) activate(items[+r.dataset.i]);
      });
      document.querySelector('.modes').addEventListener('click', e => e.target.dataset.mode && setMode(e.target.dataset.mode));
      glaze.onOutput(() => mode === 'windows' && render());

      render();
      q.focus();
      // Keep the app cache fresh (new installs) without paying for it on every open.
      try {
        if (Date.now() - (+localStorage.getItem('cached') || 0) > 30 * 60e3) {
          localStorage.setItem('cached', Date.now());
          setTimeout(() => mw4w('cache'), 1500);
        }
      } catch {}
    </script>
  </body>
</html>
